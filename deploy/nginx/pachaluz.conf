server {
    listen 80;
    listen [::]:80;
    server_name pachaluz.example;

    root /var/www/pachaluz;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location ~* ^/_nuxt/.*\.(css|js|map|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(avif|gif|jpe?g|png|svg|webp)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location ~* \.(json|xml)$ {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
